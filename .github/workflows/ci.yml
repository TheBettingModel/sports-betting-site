name: TBM Platform CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI_DB_PASSWORD: tbm_ci_only
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tbm_ci
          POSTGRES_PASSWORD: tbm_ci_only
          POSTGRES_DB: tbm_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tbm_ci -d tbm_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Configure disposable test database
        run: |
          db_url='postgresql://'
          db_url="${db_url}tbm_ci:${CI_DB_PASSWORD}@localhost:5432/tbm_ci"
          echo "DATABASE_URL=$db_url" >> "$GITHUB_ENV"
      - run: pnpm --filter @workspace/db run push
      - run: pnpm --filter @workspace/api-server exec tsx ./scripts/install-guarded-serving-guards.ts
      - run: pnpm run security:signing-credentials
      - run: pnpm run security:source
      - run: pnpm run release:preflight
      - run: pnpm run typecheck
      - run: pnpm --filter @workspace/api-server test
      - run: pnpm --filter @workspace/api-server run build
      - run: pnpm --filter @workspace/admin run build