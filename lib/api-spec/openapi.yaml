openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: games
    description: Game data with model projections
  - name: model
    description: Model learning stats
  - name: results
    description: Model performance results and ROI
  - name: device
    description: Device push token and preference management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /games/today:
    get:
      operationId: getGamesToday
      tags: [games]
      summary: Get today's games with model projections
      parameters:
        - name: sport
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Today's games with projections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamesTodayResponse"

  /games/refresh:
    post:
      operationId: refreshGames
      tags: [games]
      summary: Pull fresh game data from ESPN and run model update
      responses:
        "200":
          description: Refresh completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"

  /results/summary:
    get:
      operationId: getResultsSummary
      tags: [results]
      summary: Get overall and per-sport model performance summary
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Results summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultsSummaryResponse"

  /results/roi:
    get:
      operationId: getResultsRoi
      tags: [results]
      summary: Get win%, units, and ROI broken down by sport and rating tier
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: ROI breakdown by rating and sport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultsRoiResponse"

  /model-stats/history:
    get:
      operationId: getModelStatsHistory
      tags: [model]
      summary: Get weekly win-rate and units history per sport (last 8 weeks)
      responses:
        "200":
          description: Weekly model performance history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatsHistoryResponse"

  /model/stats:
    get:
      operationId: getModelStats
      tags: [model]
      summary: Get model learning accuracy stats per sport
      responses:
        "200":
          description: Model accuracy stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatsResponse"

  /admin/loss-reviews:
    get:
      operationId: getAdminLossReviews
      tags: [admin]
      summary: Get internal evidence-based reviews for graded losses
      parameters:
        - name: sport
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Recent loss reviews and recurring evidence patterns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LossReviewsResponse"

  /admin/outcome-reviews:
    get:
      operationId: getAdminOutcomeReviews
      tags: [admin]
      summary: Get internal evidence-based reviews for graded wins and losses
      parameters:
        - name: sport
          in: query
          required: false
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [all, win, loss]
            default: all
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Recent completed outcome reviews and recurring evidence patterns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeReviewsResponse"

  /admin/mlb-policy-revisions:
    get:
      operationId: getMlbPolicyRevisions
      tags: [admin]
      summary: List immutable MLB moneyline policy revisions and audit counts
      responses:
        "200":
          description: MLB policy revisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MlbPolicyRevisionList"
    post:
      operationId: applyMlbPolicyRevision
      tags: [admin]
      summary: Apply an authorized MLB policy revision to unstarted games only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MlbPolicyRevisionInput"
      responses:
        "201":
          description: Policy revision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MlbPolicyRevisionApplyResult"
        "400":
          description: Invalid immutable revision request
        "401":
          description: Unauthorized

  /push-tokens:
    post:
      operationId: registerPushToken
      tags: [device]
      summary: Register a device push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenRequest"
      responses:
        "200":
          description: Token registered
        "400":
          description: Bad request

    delete:
      operationId: deregisterPushToken
      tags: [device]
      summary: Remove a device push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeregisterPushTokenRequest"
      responses:
        "200":
          description: Token removed

  /notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [device]
      summary: Get per-sport notification preferences for the authenticated user
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"

    put:
      operationId: updateNotificationPreferences
      tags: [device]
      summary: Update per-sport notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationPreferencesRequest"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"

  /preferences:
    get:
      operationId: getUserPreferences
      tags: [device]
      summary: Get notification/alert preferences for the authenticated user
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"

    put:
      operationId: updateUserPreferences
      tags: [device]
      summary: Update notification/alert preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPreferencesRequest"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"

  /subscriptions/sync:
    post:
      operationId: syncSubscription
      tags: [device]
      summary: Sync RevenueCat entitlement to server DB (fallback for missed webhooks)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionSyncRequest"
      responses:
        "200":
          description: Subscription synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionSyncResponse"
        "401":
          description: Unauthorized

  /subscriptions/status:
    get:
      operationId: getSubscriptionStatus
      tags: [device]
      summary: Get current subscription status from server DB
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatusResponse"
        "401":
          description: Unauthorized

components:
  schemas:
    MlbMoneylinePolicy:
      type: object
      properties:
        version:
          type: string
          enum: [mlb-moneyline-policy-v1]
        buyThreshold:
          type: number
        strongBuyThreshold:
          type: number
        awayOffset:
          type: number
        maxFavoriteOdds:
          type: integer
    MlbPolicyRevisionInput:
      type: object
      required: [revisionKey, reason]
      properties:
        revisionKey:
          type: string
          minLength: 3
        reason:
          type: string
          minLength: 8
        policy:
          $ref: "#/components/schemas/MlbMoneylinePolicy"
    MlbPolicyRevision:
      type: object
      required: [id, revisionKey, sport, market, policyManifest, policyHash, reason, createdBy, activatedAt]
      properties:
        id: { type: integer }
        revisionKey: { type: string }
        sport: { type: string }
        market: { type: string }
        policyManifest: { $ref: "#/components/schemas/MlbMoneylinePolicy" }
        policyHash: { type: string }
        reason: { type: string }
        createdBy: { type: string }
        activatedAt: { type: string, format: date-time }
        affectedPredictions: { type: integer }
        effectivePicks: { type: integer }
    MlbPolicyRevisionList:
      type: object
      required: [revisions, count]
      properties:
        revisions:
          type: array
          items: { $ref: "#/components/schemas/MlbPolicyRevision" }
        count: { type: integer }
    MlbPolicyRevisionApplyResult:
      type: object
      required: [revision, createdPredictions, effectivePicks, skipped]
      properties:
        revision: { $ref: "#/components/schemas/MlbPolicyRevision" }
        createdPredictions: { type: integer }
        effectivePicks: { type: integer }
        skipped: { type: integer }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GameProjection:
      type: object
      properties:
        id:
          type: string
        sport:
          type: string
        league:
          type: string
          nullable: true
        isLocked:
          type: boolean
        homeTeamId:
          type: string
          nullable: true
        homeTeamAbbr:
          type: string
        homeTeamName:
          type: string
        homeTeamRecord:
          type: string
        homeTeamLogo:
          type: string
          nullable: true
        awayTeamAbbr:
          type: string
        awayTeamName:
          type: string
        awayTeamRecord:
          type: string
        awayTeamLogo:
          type: string
          nullable: true
        awayTeamId:
          type: string
          nullable: true
        gameTime:
          type: string
        gameDate:
          type: string
        status:
          type: string
        homeScore:
          type: integer
          nullable: true
        awayScore:
          type: integer
          nullable: true
        homeWinPct:
          type: integer
        confidence:
          type: string
        projectedSpread:
          type: number
        projectedTotal:
          type: number
        valueRating:
          type: string
        modelScore:
          type: integer
        edge:
          type: number
        confidenceNum:
          type: integer
        units:
          type: number
        sharpScore:
          type: integer
        sharpSignal:
          type: string
        finalModelScore:
          type: integer
        finalModelTier:
          type: string
        finalModelStars:
          type: integer
        podScore:
          type: number
        vegasSpread:
          type: number
        vegasTotal:
          type: number
        vegasHomeOdds:
          type: integer
        vegasAwayOdds:
          type: integer
        vegasDrawOdds:
          type: integer
        openingHomeOdds:
          type: integer
          nullable: true
        openingAwayOdds:
          type: integer
          nullable: true
        homeStarterName:
          type: string
          nullable: true
        homeStarterEra:
          type: number
          nullable: true
        homeStarterRecentEra:
          type: number
          nullable: true
        homeStarterHand:
          type: string
          nullable: true
        awayStarterName:
          type: string
          nullable: true
        awayStarterEra:
          type: number
          nullable: true
        awayStarterRecentEra:
          type: number
          nullable: true
        awayStarterHand:
          type: string
          nullable: true
        bestLineBook:
          type: string
          nullable: true
        bestLineOdds:
          type: integer
          nullable: true
        weatherWindMph:
          type: number
          nullable: true
        weatherTotalAdj:
          type: number
          nullable: true
        weatherSummary:
          type: string
          nullable: true
        homeGoalieName:
          type: string
          nullable: true
        homeGoalieSavePct:
          type: number
          nullable: true
        awayGoalieName:
          type: string
          nullable: true
        awayGoalieSavePct:
          type: number
          nullable: true
        homeKeyInjuries:
          type: string
          nullable: true
        awayKeyInjuries:
          type: string
          nullable: true
        predictionCorrect:
          type: boolean
          nullable: true
      required:
        - id
        - sport
        - homeTeamAbbr
        - homeTeamName
        - homeTeamRecord
        - awayTeamAbbr
        - awayTeamName
        - awayTeamRecord
        - gameTime
        - gameDate
        - status
        - homeWinPct
        - confidence
        - projectedSpread
        - projectedTotal
        - valueRating
        - modelScore
        - edge
        - vegasSpread
        - vegasTotal
        - vegasHomeOdds
        - vegasAwayOdds

    GamesTodayResponse:
      type: object
      properties:
        games:
          type: array
          items:
            $ref: "#/components/schemas/GameProjection"
        lastUpdated:
          type: string
        totalGames:
          type: integer
        liveGamesCount:
          type: integer
        isSubscribed:
          type: boolean
      required:
        - games
        - lastUpdated
        - totalGames
        - liveGamesCount
        - isSubscribed

    RefreshResponse:
      type: object
      properties:
        message:
          type: string
        gamesUpdated:
          type: integer
        sportsRefreshed:
          type: array
          items:
            type: string
      required:
        - message
        - gamesUpdated
        - sportsRefreshed

    OverallStat:
      type: object
      properties:
        wins:
          type: integer
        losses:
          type: integer
        pushes:
          type: integer
        totalPicks:
          type: integer
        winRate:
          type: number
        unitsWonLost:
          type: number
      required: [wins, losses, pushes, totalPicks, winRate, unitsWonLost]

    SportStat:
      type: object
      properties:
        sport:
          type: string
        wins:
          type: integer
        losses:
          type: integer
        pushes:
          type: integer
        totalPicks:
          type: integer
        winRate:
          type: number
        unitsWonLost:
          type: number
        currentStreak:
          type: integer
        currentStreakDir:
          type: string
      required: [sport, wins, losses, pushes, totalPicks, winRate, unitsWonLost, currentStreak, currentStreakDir]

    RecentResult:
      type: object
      properties:
        pickId:
          type: integer
        sport:
          type: string
        awayTeamAbbr:
          type: string
        homeTeamAbbr:
          type: string
        awayScore:
          type: integer
          nullable: true
        homeScore:
          type: integer
          nullable: true
        pick:
          type: string
        odds:
          type: integer
          nullable: true
        unitsRisked:
          type: number
          nullable: true
        unitsWonLost:
          type: number
        result:
          type: string
        gameDate:
          type: string
        gradedAt:
          type: string
          nullable: true
      required: [pickId, sport, awayTeamAbbr, homeTeamAbbr, pick, unitsWonLost, result, gameDate]

    ResultsSummaryResponse:
      type: object
      properties:
        period:
          type: string
        overall:
          $ref: "#/components/schemas/OverallStat"
        bySport:
          type: array
          items:
            $ref: "#/components/schemas/SportStat"
        recentResults:
          type: array
          items:
            $ref: "#/components/schemas/RecentResult"
        dataAsOf:
          type: string
      required: [overall, bySport]

    RoiEntry:
      type: object
      properties:
        key:
          type: string
        wins:
          type: integer
        losses:
          type: integer
        pushes:
          type: integer
        totalPicks:
          type: integer
        winRate:
          type: number
        unitsWonLost:
          type: number
        unitsRisked:
          type: number
        roi:
          type: number
      required: [key, wins, losses, pushes, totalPicks, winRate, unitsWonLost, unitsRisked, roi]

    RoiByRatingEntry:
      allOf:
        - $ref: "#/components/schemas/RoiEntry"
        - type: object
          properties:
            recommendation:
              type: string
          required: [recommendation]

    RoiBySportEntry:
      allOf:
        - $ref: "#/components/schemas/RoiEntry"
        - type: object
          properties:
            sport:
              type: string
          required: [sport]

    RoiBySportAndRatingEntry:
      allOf:
        - $ref: "#/components/schemas/RoiEntry"
        - type: object
          properties:
            sport:
              type: string
            recommendation:
              type: string
          required: [sport, recommendation]

    ResultsRoiResponse:
      type: object
      properties:
        period:
          type: string
        byRating:
          type: array
          items:
            $ref: "#/components/schemas/RoiByRatingEntry"
        bySport:
          type: array
          items:
            $ref: "#/components/schemas/RoiBySportEntry"
        bySportAndRating:
          type: array
          items:
            $ref: "#/components/schemas/RoiBySportAndRatingEntry"
        dataAsOf:
          type: string
      required: [byRating, bySport, bySportAndRating]

    ModelStatsHistoryEntry:
      type: object
      properties:
        week:
          type: string
        sport:
          type: string
        wins:
          type: integer
        losses:
          type: integer
        pushes:
          type: integer
        unitsWon:
          type: number
        totalPicks:
          type: integer
      required: [week, sport, wins, losses, pushes, unitsWon, totalPicks]

    ModelStatsHistoryResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: "#/components/schemas/ModelStatsHistoryEntry"
        dataAsOf:
          type: string
      required: [history, dataAsOf]

    ModelSportStat:
      type: object
      properties:
        sport:
          type: string
        accuracyRate:
          type: number
        totalPredictions:
          type: integer
        correctPredictions:
          type: integer
        strongBuyAccuracy:
          type: number
        buyAccuracy:
          type: number
        confidenceMultiplier:
          type: number
        lastLearnedAt:
          type: string
          nullable: true
      required:
        - sport
        - accuracyRate
        - totalPredictions
        - correctPredictions
        - strongBuyAccuracy
        - buyAccuracy
        - confidenceMultiplier

    ModelStatsResponse:
      type: object
      properties:
        stats:
          type: array
          items:
            $ref: "#/components/schemas/ModelSportStat"
        overallAccuracy:
          type: number
        totalPredictions:
          type: integer
        dataAsOf:
          type: string
      required:
        - stats
        - overallAccuracy
        - totalPredictions
        - dataAsOf

    LossReviewEntry:
      type: object
      properties:
        pickId:
          type: integer
        sport:
          type: string
        market:
          type: string
        selection:
          type: string
        recommendation:
          type: string
        confidence:
          type: string
        publishedAt:
          type: string
        modelProbability:
          type: number
        finalRating:
          type: [number, "null"]
        finalScore:
          type: [string, "null"]
        clv:
          type: [number, "null"]
        gradedAt:
          type: [string, "null"]
        review:
          type: [object, "null"]
          additionalProperties: true
      required: [pickId, sport, market, selection, recommendation, confidence, publishedAt, modelProbability, review]

    OutcomeReviewEntry:
      allOf:
        - $ref: "#/components/schemas/LossReviewEntry"
        - type: object
          properties:
            result:
              type: string
              enum: [win, loss]
          required: [result]

    LossReviewPattern:
      type: object
      properties:
        classification:
          type: string
        sampleSize:
          type: integer
      required: [classification, sampleSize]

    LossReviewsResponse:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/LossReviewEntry"
        patterns:
          type: array
          items:
            $ref: "#/components/schemas/LossReviewPattern"
        dataAsOf:
          type: string
      required: [reviews, patterns, dataAsOf]

    OutcomeReviewsResponse:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: "#/components/schemas/OutcomeReviewEntry"
        patterns:
          type: array
          items:
            $ref: "#/components/schemas/LossReviewPattern"
        dataAsOf:
          type: string
        resultFilter:
          type: string
          enum: [all, win, loss]
      required: [reviews, patterns, dataAsOf, resultFilter]

    RegisterPushTokenRequest:
      type: object
      properties:
        token:
          type: string
        platform:
          type: string
      required: [token, platform]

    DeregisterPushTokenRequest:
      type: object
      properties:
        token:
          type: string
      required: [token]

    NotificationPreferences:
      type: object
      properties:
        enabledSports:
          type: array
          items:
            type: string
          nullable: true
        allSports:
          type: array
          items:
            type: string
      required: [allSports]

    UpdateNotificationPreferencesRequest:
      type: object
      properties:
        enabledSports:
          type: array
          items:
            type: string
          nullable: true

    UserPreferences:
      type: object
      properties:
        notifSports:
          type: array
          items:
            type: string
          nullable: true
        notifMinTier:
          type: string
        notifEnabled:
          type: boolean
        validSports:
          type: array
          items:
            type: string
        validTiers:
          type: array
          items:
            type: string
      required: [notifMinTier, notifEnabled, validSports, validTiers]

    SubscriptionSyncRequest:
      type: object
      properties:
        entitlementId:
          type: string
        expiresAt:
          type: string
          nullable: true
        isActive:
          type: boolean
      required: [entitlementId]

    SubscriptionSyncResponse:
      type: object
      properties:
        synced:
          type: boolean
        isSubscribed:
          type: boolean
      required: [synced, isSubscribed]

    SubscriptionStatusResponse:
      type: object
      properties:
        isSubscribed:
          type: boolean
        entitlement:
          type: string
          nullable: true
        expiresAt:
          type: string
          nullable: true
      required: [isSubscribed]

    UpdateUserPreferencesRequest:
      type: object
      properties:
        notifSports:
          type: array
          items:
            type: string
          nullable: true
        notifMinTier:
          type: string
        notifEnabled:
          type: boolean
