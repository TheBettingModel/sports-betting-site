openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: games
    description: Game data with model projections
  - name: model
    description: Model learning stats
  - name: results
    description: Model performance results and ROI
  - name: device
    description: Device push token and preference management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /games/today:
    get:
      operationId: getGamesToday
      tags: [games]
      summary: Get today's games with model projections
      parameters:
        - name: sport
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Today's games with projections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamesTodayResponse"

  /games/refresh:
    post:
      operationId: refreshGames
      tags: [games]
      summary: Pull fresh game data from ESPN and run model update
      responses:
        "200":
          description: Refresh completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"

  /results/summary:
    get:
      operationId: getResultsSummary
      tags: [results]
      summary: Get overall and per-sport model performance summary
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Results summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultsSummaryResponse"

  /results/roi:
    get:
      operationId: getResultsRoi
      tags: [results]
      summary: Get win%, units, and ROI broken down by sport and rating tier
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: ROI breakdown by rating and sport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultsRoiResponse"

  /model-stats/history:
    get:
      operationId: getModelStatsHistory
      tags: [model]
      summary: Get weekly win-rate and units history per sport (last 8 weeks)
      responses:
        "200":
          description: Weekly model performance history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatsHistoryResponse"

  /model/stats:
    get:
      operationId: getModelStats
      tags: [model]
      summary: Get model learning accuracy stats per sport
      responses:
        "200":
          description: Model accuracy stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatsResponse"

  /push-tokens:
    post:
      operationId: registerPushToken
      tags: [device]
      summary: Register a device push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenRequest"
      responses:
        "200":
          description: Token registered
        "400":
          description: Bad request

    delete:
      operationId: deregisterPushToken
      tags: [device]
      summary: Remove a device push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeregisterPushTokenRequest"
      responses:
        "200":
          description: Token removed

  /notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [device]
      summary: Get per-sport notification preferences for the authenticated user
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"

    put:
      operationId: updateNotificationPreferences
      tags: [device]
      summary: Update per-sport notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationPreferencesRequest"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"

  /preferences:
    get:
      operationId: getUserPreferences
      tags: [device]
      summary: Get notification/alert preferences for the authenticated user
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"

    put:
      operationId: updateUserPreferences
      tags: [device]
      summary: Update notification/alert preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPreferencesRequest"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"

  /subscriptions/sync:
    post:
      operationId: syncSubscription
      tags: [device]
      summary: Sync RevenueCat entitlement to server DB (fallback for missed webhooks)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionSyncRequest"
      responses:
        "200":
          description: Subscription synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionSyncResponse"
        "401":
          description: Unauthorized

  /subscriptions/status:
    get:
      operationId: getSubscriptionStatus
      tags: [device]
      summary: Get current subscription status from server DB
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatusResponse"
        "401":
          description: Unauthorized

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    GameProjection:
      type: object
      properties:
        id:
          type: string
        sport:
          type: string
        homeTeamAbbr:
          type: string
        homeTeamName:
          type: string
        homeTeamRecord:
          type: string
        homeTeamLogo:
          type: string
          nullable: true
        awayTeamAbbr:
          type: string
        awayTeamName:
          type: string
        awayTeamRecord:
          type: string
        awayTeamLogo:
          type: string
          nullable: true
        gameTime:
          type: string
        gameDate:
          type: string
        status:
          type: string
        homeScore:
          type: integer
          nullable: true
        awayScore:
          type: integer
          nullable: true
        homeWinPct:
          type: integer
        confidence:
          type: string
        projectedSpread:
          type: number
        projectedTotal:
          type: number
        valueRating:
          type: string
        modelScore:
          type: integer
        edge:
          type: number
        vegasSpread:
          type: number
        vegasTotal:
          type: number
        vegasHomeOdds:
          type: integer
        vegasAwayOdds:
          type: integer
        predictionCorrect:
          type: boolean
          nullable: true
      required:
        - id
        - sport
        - homeTeamAbbr
        - homeTeamName
        - homeTeamRecord
        - awayTeamAbbr
        - awayTeamName
        - awayTeamRecord
        - gameTime
        - gameDate
        - status
        - homeWinPct
        - confidence
        - projectedSpread
        - projectedTotal
        - valueRating
        - modelScore
        - edge
        - vegasSpread
        - vegasTotal
        - vegasHomeOdds
        - vegasAwayOdds

    GamesTodayResponse:
      type: object
      properties:
        games:
          type: array
          items:
            $ref: "#/components/schemas/GameProjection"
        lastUpdated:
          type: string
        totalGames:
          type: integer
      required:
        - games
        - lastUpdated
        - totalGames

    RefreshResponse:
      type: object
      properties:
        message:
          type: string
        gamesUpdated:
          type: integer
        sportsRefreshed:
          type: array
          items:
            type: string
      required:
        - message
        - gamesUpdated
        - sportsRefreshed

    OverallStat:
      type: object
      properties:
        wins:
          type: integer
        losses:
          type: integer
        pushes:
          type: integer
        totalPicks:
          type: integer
        winRate:
          type: number
        unitsWonLost:
          type: number
      required: [wins, losses, pushes, totalPicks, winRate, unitsWonLost]

    SportStat:
      type: object
      properties:
        sport:
          type: string
        wins:
          type: integer
        losses:
          type: integer
        pushes:
          type: integer
        totalPicks:
          type: integer
        winRate:
          type: number
        unitsWonLost:
          type: number
        currentStreak:
          type: integer
        currentStreakDir:
          type: string
      required: [sport, wins, losses, pushes, totalPicks, winRate, unitsWonLost, currentStreak, currentStreakDir]

    RecentResult:
      type: object
      properties:
        pickId:
          type: integer
        sport:
          type: string
        awayTeamAbbr:
          type: string
        homeTeamAbbr:
          type: string
        awayScore:
          type: integer
          nullable: true
        homeScore:
          type: integer
          nullable: true
        pick:
          type: string
        odds:
          type: integer
          nullable: true
        unitsRisked:
          type: number
          nullable: true
        unitsWonLost:
          type: number
        result:
          type: string
        gameDate:
          type: string
        gradedAt:
          type: string
          nullable: true
      required: [pickId, sport, awayTeamAbbr, homeTeamAbbr, pick, unitsWonLost, result, gameDate]

    ResultsSummaryResponse:
      type: object
      properties:
        period:
          type: string
        overall:
          $ref: "#/components/schemas/OverallStat"
        bySport:
          type: array
          items:
            $ref: "#/components/schemas/SportStat"
        recentResults:
          type: array
          items:
            $ref: "#/components/schemas/RecentResult"
        dataAsOf:
          type: string
      required: [overall, bySport]

    RoiEntry:
      type: object
      properties:
        key:
          type: string
        wins:
          type: integer
        losses:
          type: integer
        pushes:
          type: integer
        totalPicks:
          type: integer
        winRate:
          type: number
        unitsWonLost:
          type: number
        unitsRisked:
          type: number
        roi:
          type: number
      required: [key, wins, losses, pushes, totalPicks, winRate, unitsWonLost, unitsRisked, roi]

    RoiByRatingEntry:
      allOf:
        - $ref: "#/components/schemas/RoiEntry"
        - type: object
          properties:
            recommendation:
              type: string
          required: [recommendation]

    RoiBySportEntry:
      allOf:
        - $ref: "#/components/schemas/RoiEntry"
        - type: object
          properties:
            sport:
              type: string
          required: [sport]

    RoiBySportAndRatingEntry:
      allOf:
        - $ref: "#/components/schemas/RoiEntry"
        - type: object
          properties:
            sport:
              type: string
            recommendation:
              type: string
          required: [sport, recommendation]

    ResultsRoiResponse:
      type: object
      properties:
        period:
          type: string
        byRating:
          type: array
          items:
            $ref: "#/components/schemas/RoiByRatingEntry"
        bySport:
          type: array
          items:
            $ref: "#/components/schemas/RoiBySportEntry"
        bySportAndRating:
          type: array
          items:
            $ref: "#/components/schemas/RoiBySportAndRatingEntry"
        dataAsOf:
          type: string
      required: [byRating, bySport, bySportAndRating]

    ModelStatsHistoryEntry:
      type: object
      properties:
        week:
          type: string
        sport:
          type: string
        wins:
          type: integer
        losses:
          type: integer
        pushes:
          type: integer
        unitsWon:
          type: number
        totalPicks:
          type: integer
      required: [week, sport, wins, losses, pushes, unitsWon, totalPicks]

    ModelStatsHistoryResponse:
      type: object
      properties:
        history:
          type: array
          items:
            $ref: "#/components/schemas/ModelStatsHistoryEntry"
        dataAsOf:
          type: string
      required: [history, dataAsOf]

    ModelSportStat:
      type: object
      properties:
        sport:
          type: string
        accuracyRate:
          type: number
        totalPredictions:
          type: integer
        correctPredictions:
          type: integer
        strongBuyAccuracy:
          type: number
        buyAccuracy:
          type: number
        confidenceMultiplier:
          type: number
        lastLearnedAt:
          type: string
          nullable: true
      required:
        - sport
        - accuracyRate
        - totalPredictions
        - correctPredictions
        - strongBuyAccuracy
        - buyAccuracy
        - confidenceMultiplier

    ModelStatsResponse:
      type: object
      properties:
        stats:
          type: array
          items:
            $ref: "#/components/schemas/ModelSportStat"
        overallAccuracy:
          type: number
        totalPredictions:
          type: integer
        dataAsOf:
          type: string
      required:
        - stats
        - overallAccuracy
        - totalPredictions
        - dataAsOf

    RegisterPushTokenRequest:
      type: object
      properties:
        token:
          type: string
        platform:
          type: string
      required: [token, platform]

    DeregisterPushTokenRequest:
      type: object
      properties:
        token:
          type: string
      required: [token]

    NotificationPreferences:
      type: object
      properties:
        enabledSports:
          type: array
          items:
            type: string
          nullable: true
        allSports:
          type: array
          items:
            type: string
      required: [allSports]

    UpdateNotificationPreferencesRequest:
      type: object
      properties:
        enabledSports:
          type: array
          items:
            type: string
          nullable: true

    UserPreferences:
      type: object
      properties:
        notifSports:
          type: array
          items:
            type: string
          nullable: true
        notifMinTier:
          type: string
        notifEnabled:
          type: boolean
        validSports:
          type: array
          items:
            type: string
        validTiers:
          type: array
          items:
            type: string
      required: [notifMinTier, notifEnabled, validSports, validTiers]

    SubscriptionSyncRequest:
      type: object
      properties:
        entitlementId:
          type: string
        expiresAt:
          type: string
          nullable: true
        isActive:
          type: boolean
      required: [entitlementId]

    SubscriptionSyncResponse:
      type: object
      properties:
        synced:
          type: boolean
        isSubscribed:
          type: boolean
      required: [synced, isSubscribed]

    SubscriptionStatusResponse:
      type: object
      properties:
        isSubscribed:
          type: boolean
        entitlement:
          type: string
          nullable: true
        expiresAt:
          type: string
          nullable: true
      required: [isSubscribed]

    UpdateUserPreferencesRequest:
      type: object
      properties:
        notifSports:
          type: array
          items:
            type: string
          nullable: true
        notifMinTier:
          type: string
        notifEnabled:
          type: boolean
