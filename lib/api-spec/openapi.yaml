openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: games
    description: Game data with model projections
  - name: model
    description: Model learning stats
  - name: results
    description: Model performance results and ROI
  - name: device
    description: Device push token and preference management
  - name: chat
    description: Subscriber community chat
  - name: admin
    description: Internal administrator operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /readyz:
    get:
      operationId: readinessCheck
      tags: [health]
      summary: Check database, scheduler, guarded serving, and V4 readiness
      responses:
        "200": { description: Service is ready }
        "503": { description: Service is not ready }

  /support:
    get:
      operationId: getSupportInformation
      tags: [health]
      summary: Get application support information
      responses:
        "200": { description: Support information }

  /games/today:
    get:
      operationId: getGamesToday
      tags: [games]
      summary: Get today's games with model projections
      parameters:
        - name: sport
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Today's games with projections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GamesTodayResponse"

  /games/refresh:
    post:
      operationId: refreshGames
      tags: [games]
      summary: Pull fresh game data from ESPN and run model update
      responses:
        "200":
          description: Refresh completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"

  /model/ncaaf/v4/projections:
    get:
      operationId: getNcaafV4Projections
      tags: [model]
      summary: Get the NCAAF V4 preview projection board for an Eastern calendar date
      description: >-
        Read-only NCAAF-only preview board. It never creates wagers, changes the
        incumbent champion, or grants production publication approval.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: date
          in: query
          required: false
          description: YYYY-MM-DD in America/New_York; omitted selects today.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Frozen-model V4 preview board
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NcaafV4SubscriberProjectionBoard" }
        "400": { description: Invalid requested date }
        "401": { description: Authentication required }
        "403": { description: Active subscription or owner access required }

  /model/v4/projections:
    get:
      operationId: getV4FullSlateProjections
      tags: [model]
      summary: Get safe full-slate V4 model projections
      description: >-
        Returns every legitimate V4 forecast for one sport/day plus explicit
        coverage failures. Validating projections are not official TBM picks.
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sport
          in: query
          required: true
          schema:
            type: string
            enum: [MLB, NCAAF, NFL, NBA, WNBA, NHL, SOCCER, NCAAMB]
        - name: date
          in: query
          required: false
          description: YYYY-MM-DD in America/New_York; omitted selects today.
          schema: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
      responses:
        "200":
          description: Safe model projections and full-slate coverage
          content:
            application/json:
              schema: { $ref: "#/components/schemas/V4FullSlateProjectionResponse" }
        "400": { description: Invalid sport or date }

  /internal/mlb-v4/readiness:
    get:
      operationId: getInternalMlbV4Readiness
      tags: [admin]
      summary: Get internal MLB V4 evidence and executor readiness
      responses:
        "200": { description: MLB V4 readiness status }

  /chat/access:
    get:
      operationId: getChatAccess
      tags: [chat]
      summary: Get authenticated chat access metadata
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Chat access metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAccess" }
        "401": { description: Unauthorized }
  /chat/messages:
    get:
      operationId: getChatMessages
      tags: [chat]
      summary: List chronological chat messages for Pro members
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Chat messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessagesResponse" }
        "401": { description: Unauthorized }
        "403": { description: Pro subscription required }
    post:
      operationId: createChatMessage
      tags: [chat]
      summary: Post an owner chat message
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateChatMessageRequest" }
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatMessageResponse" }
        "401": { description: Unauthorized }
        "403": { description: Owner required }
        "400": { description: Invalid body }
  /chat/preferences:
    put:
      operationId: updateChatPreferences
      tags: [chat]
      summary: Update chat notification preference
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateChatPreferencesRequest" }
      responses:
        "200":
          description: Updated preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatPreferences" }
        "401": { description: Unauthorized }
        "403": { description: Pro subscription required }

  /admin/model-runtime-status:
    get:
      operationId: getAdminModelRuntimeStatus
      tags: [admin]
      summary: Get actual guarded-serving configuration, identity, approval, and health
      responses:
        "200":
          description: Guarded model runtime status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRuntimeStatus"

  /admin/model-runtime-dry-run:
    post:
      operationId: runAdminModelRuntimeDryRun
      tags: [admin]
      summary: Run an immutable real-slate guarded-serving dry run without publication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelRuntimeDryRunInput"
      responses:
        "200":
          description: Persisted dry-run disposition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelRuntimeDryRunResult"
        "400": { description: Invalid sport }

  /admin/model-artifact-approvals:
    post:
      operationId: appendAdminModelArtifactApproval
      tags: [admin]
      summary: Append an explicit governed exact-artifact approval decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModelArtifactApprovalInput"
      responses:
        "201":
          description: Approval decision appended
          content:
            application/json:
              schema:
                type: object
                required: [eventId]
                properties:
                  eventId: { type: string }
        "400": { description: Invalid or incomplete exact identity }

  /admin/spread-models:
    get:
      operationId: getAdminSpreadModels
      tags: [admin]
      summary: Get isolated spread model configurations and validation metrics
      responses:
        "200":
          description: Spread model status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /admin/ncaaf-readiness:
    get:
      operationId: getAdminNcaafReadiness
      tags: [admin]
      summary: Get read-only NCAAF challenger evidence and validation readiness
      description: Admin-only observability. This endpoint never changes model, evidence, publication, or promotion state.
      responses:
        "200":
          description: NCAAF readiness and evidence coverage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NcaafReadiness"
        "401": { description: Administrator credentials required }

  /admin/ncaaf/v4/today-board:
    get:
      operationId: getAdminNcaafV4TodayBoard
      tags: [admin]
      summary: Get the complete current Eastern-day NCAAF V4 preview board
      description: >-
        Master-admin-only, today-only observability endpoint. It does not accept
        a date override and never changes registry, publication, or champion state.
      security: [{ masterApiKey: [] }]
      responses:
        "200":
          description: Current-day frozen V4 preview board with market health and profiling
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NcaafV4ProjectionBoard" }
        "401": { description: Master administrator credentials required }
        "503": { description: Master administrator authentication is not configured }

  /admin/ncaaf/core-backfill:
    post:
      operationId: runAdminNcaafCoreBackfill
      tags: [admin]
      summary: Manually backfill CFBD core games and materialize NCAAF v2 training rows
      description: >-
        Internal, master-admin-only operation. It sequentially captures the 2023,
        2024, and 2025 CFBD games aggregates and materializes bounded 500-row
        training batches. It is manual-only, idempotent, and does not acquire the
        live NCAAF lock. A returned nextCursor must be supplied to resume after
        the per-request materialization cap.
      security: [{ masterApiKey: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NcaafCoreBackfillRequest"
      responses:
        "200":
          description: Aggregate counts and replay audit; provider payloads are never returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NcaafCoreBackfillResult"
        "400": { description: Invalid cursor or dryRun value }
        "401": { description: Master administrator credentials required }
        "503": { description: Master administrator authentication is not configured }

  /admin/ncaaf-readiness/{eventId}:
    get:
      operationId: getAdminNcaafEventReadiness
      tags: [admin]
      summary: Get read-only NCAAF evidence readiness for one canonical provider event
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Per-event NCAAF evidence, cohort, feature, performance, and market-match audit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NcaafEventReadiness" }
        "401": { description: Administrator credentials required }
        "404": { description: NCAAF evidence event not found }

  /admin/market-comparisons:
    get:
      operationId: getAdminMarketComparisons
      tags: [admin]
      summary: Compare internal moneyline and spread candidates with the official selected market
      parameters:
        - name: sport
          in: query
          required: false
          schema: { type: string, default: NCAAF }
      responses:
        "200":
          description: Internal market candidate comparisons
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /admin/market-approvals:
    get:
      operationId: getAdminMarketApprovals
      tags: [admin]
      summary: List latest exact automatic and manual market approval decisions
      responses:
        "200":
          description: Latest append-only approval decisions by exact evidence identity
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: createAdminMarketApproval
      tags: [admin]
      summary: Append an exceptional manual market approval lifecycle decision
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketApprovalDecisionInput"
      responses:
        "201":
          description: Approval decision appended
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          description: Production approval evidence layers did not all pass

  /admin/spread-models/{sport}/refresh-validation:
    post:
      operationId: refreshAdminSpreadValidation
      tags: [admin]
      summary: Recompute and persist spread validation metrics
      parameters:
        - name: sport
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Refreshed validation metrics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /admin/spread-models/{sport}/promote:
    post:
      operationId: promoteAdminSpreadModel
      tags: [admin]
      summary: Promote a spread model only when all validation gates pass
      parameters:
        - name: sport
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Spread model promoted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          description: Promotion gates did not pass

  /admin/spread-models/{sport}/suspend:
    post:
      operationId: suspendAdminSpreadModel
      tags: [admin]
      summary: Suspend a spread model without deleting prior approval history
      parameters:
        - name: sport
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpreadModelSuspensionInput"
      responses:
        "200":
          description: Spread model suspended
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          description: No exact validation context exists to suspend

  /results/summary:
    get:
      operationId: getResultsSummary
      tags: [results]
      summary: Get overall and per-sport model performance summary
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Results summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultsSummaryResponse"

  /results/roi:
    get:
      operationId: getResultsRoi
      tags: [results]
      summary: Get win%, units, and ROI broken down by sport and rating tier
      parameters:
        - name: period
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: ROI breakdown by rating and sport
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultsRoiResponse"

  /model-stats/history:
    get:
      operationId: getModelStatsHistory
      tags: [model]
      summary: Get weekly win-rate and units history per sport (last 8 weeks)
      responses:
        "200":
          description: Weekly model performance history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatsHistoryResponse"

  /model/stats:
    get:
      operationId: getModelStats
      tags: [model]
      summary: Get model learning accuracy stats per sport
      responses:
        "200":
          description: Model accuracy stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelStatsResponse"

  /admin/loss-reviews:
    get:
      operationId: getAdminLossReviews
      tags: [admin]
      summary: Get internal evidence-based reviews for graded losses
      parameters:
        - name: sport
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Recent loss reviews and recurring evidence patterns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LossReviewsResponse"

  /admin/outcome-reviews:
    get:
      operationId: getAdminOutcomeReviews
      tags: [admin]
      summary: Get internal evidence-based reviews for graded wins and losses
      parameters:
        - name: sport
          in: query
          required: false
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [all, win, loss]
            default: all
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Recent completed outcome reviews and recurring evidence patterns
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutcomeReviewsResponse"

  /admin/publication-decisions:
    get:
      operationId: getAdminPublicationDecisions
      tags: [admin]
      summary: Inspect effective downstream publication decisions for one Eastern calendar date
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Candidate-level publication status, reason, rank, staking, POTD, and model identity
          content:
            application/json:
              schema:
                type: object
                required: [easternDate, dataAsOf, decisions]
                properties:
                  easternDate: { type: string, format: date }
                  dataAsOf: { type: string, format: date-time }
                  decisions:
                    type: array
                    items:
                      type: object
                      additionalProperties: true

  /admin/forecast-reviews:
    get:
      operationId: getAdminForecastReviews
      tags: [admin]
      summary: Get auditable completed reviews for every model forecast
      parameters:
        - name: sport
          in: query
          required: false
          schema:
            type: string
        - name: market
          in: query
          required: false
          schema:
            type: string
        - name: segment
          in: query
          required: false
          schema:
            type: string
            enum: [published, forecast_only]
        - name: qualification
          in: query
          required: false
          schema:
            type: string
            enum: [qualified, passed]
        - name: result
          in: query
          required: false
          schema:
            type: string
            enum: [all, win, loss, push, void, postponed]
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Forecast review ledger rows
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      operationId: refreshAdminForecastReviews
      tags: [admin]
      summary: Idempotently backfill reviews for completed forecast snapshots
      responses:
        "200":
          description: Forecast review backfill result
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /admin/forecast-metrics:
    get:
      operationId: getAdminForecastMetrics
      tags: [admin]
      summary: Compare qualified picks with passed forecast outcomes
      parameters:
        - name: sport
          in: query
          required: false
          schema:
            type: string
        - name: market
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Coverage and selected-outcome calibration metrics
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /admin/mlb-policy-revisions:
    get:
      operationId: getMlbPolicyRevisions
      tags: [admin]
      summary: List immutable MLB moneyline policy revisions and audit counts
      responses:
        "200":
          description: MLB policy revisions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MlbPolicyRevisionList"
    post:
      operationId: applyMlbPolicyRevision
      tags: [admin]
      summary: Apply an authorized MLB policy revision to unstarted games only
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MlbPolicyRevisionInput"
      responses:
        "201":
          description: Policy revision applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MlbPolicyRevisionApplyResult"
        "400":
          description: Invalid immutable revision request
        "401":
          description: Unauthorized

  /push-tokens:
    post:
      operationId: registerPushToken
      tags: [device]
      summary: Register a device push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPushTokenRequest"
      responses:
        "200":
          description: Token registered
        "400":
          description: Bad request

    delete:
      operationId: deregisterPushToken
      tags: [device]
      summary: Remove a device push token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeregisterPushTokenRequest"
      responses:
        "200":
          description: Token removed

  /notification-preferences:
    get:
      operationId: getNotificationPreferences
      tags: [device]
      summary: Get per-sport notification preferences for the authenticated user
      responses:
        "200":
          description: Notification preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"

    put:
      operationId: updateNotificationPreferences
      tags: [device]
      summary: Update per-sport notification preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateNotificationPreferencesRequest"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPreferences"

  /preferences:
    get:
      operationId: getUserPreferences
      tags: [device]
      summary: Get notification/alert preferences for the authenticated user
      responses:
        "200":
          description: User preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"

    put:
      operationId: updateUserPreferences
      tags: [device]
      summary: Update notification/alert preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPreferencesRequest"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"

  /subscriptions/sync:
    post:
      operationId: syncSubscription
      tags: [device]
      summary: Sync RevenueCat entitlement to server DB (fallback for missed webhooks)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionSyncRequest"
      responses:
        "200":
          description: Subscription synced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionSyncResponse"
        "401":
          description: Unauthorized

  /subscriptions/status:
    get:
      operationId: getSubscriptionStatus
      tags: [device]
      summary: Get current subscription status from server DB
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Subscription status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatusResponse"
        "401":
          description: Unauthorized

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    masterApiKey:
      type: apiKey
      in: header
      name: X-Master-Key
      description: Internal master key. An authenticated admin session token is also accepted by the server.
  schemas:
    V4FullSlateProjectionResponse:
      type: object
      required: [sport, date, lifecycleDisclaimer, coverage, fixtures, officialPicks, projections]
      properties:
        sport: { type: string }
        date: { type: string }
        lifecycleDisclaimer: { type: string }
        coverage:
          type: object
          required: [scheduledEvents, eligibleEvents, forecastedEvents, failedEvents, forecastCoveragePct, failures]
          properties:
            scheduledEvents: { type: integer }
            eligibleEvents: { type: integer }
            forecastedEvents: { type: integer }
            failedEvents: { type: integer }
            forecastCoveragePct: { type: number }
            failures:
              type: array
              items:
                type: object
                required: [gameId, reason]
                properties:
                  gameId: { type: string }
                  reason: { type: string }
        fixtures:
          type: array
          description: Every event discovered for this sport/date. Join AVAILABLE entries to projections by gameId.
          items:
            type: object
            required: [gameId, sport, eventStart, homeParticipant, awayParticipant, availability, unavailableReason]
            properties:
              gameId: { type: string }
              sport: { type: string }
              eventStart: { type: [string, "null"] }
              homeParticipant:
                $ref: "#/components/schemas/V4SlateParticipant"
              awayParticipant:
                $ref: "#/components/schemas/V4SlateParticipant"
              availability:
                type: string
                enum: [AVAILABLE, UNAVAILABLE]
              unavailableReason:
                type: [string, "null"]
        officialPicks:
          type: array
          description: Persisted server-authoritative official V4 decisions; independent of current projection IDs.
          items: { $ref: "#/components/schemas/V4OfficialPick" }
        projections:
          type: array
          items: { $ref: "#/components/schemas/V4PublicProjection" }
    V4SlateParticipant:
      type: object
      required: [id, name, abbreviation, logo]
      properties:
        id: { type: [string, "null"] }
        name: { type: string }
        abbreviation: { type: [string, "null"] }
        logo: { type: [string, "null"] }
    V4PublicProjection:
      type: object
      required: [eventId, sport, modelVersion, lifecycleStatus, forecastTimestamp, officialPickStatus, officialRole, officialRank, units, officialFailureReason]
      properties:
        eventId: { type: string }
        sport: { type: string }
        eventStart: { type: [string, "null"] }
