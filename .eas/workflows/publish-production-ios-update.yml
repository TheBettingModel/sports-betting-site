name: Publish production iOS update

defaults:
  tools:
    node: "20"
    pnpm: "10.26.1"

jobs:
  publish_ios_update:
    name: Publish iOS OTA update
    environment: production
    steps:
      - uses: eas/checkout
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish iOS update
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { spawnSync } = require('node:child_process');
          const appConfigPath = './artifacts/mobile/app.json';
          const originalAppConfig = fs.readFileSync(appConfigPath, 'utf8');
          const appConfig = JSON.parse(originalAppConfig);
          const mobileEnv = require('./artifacts/mobile/eas.json').build.production.env;
          const supportedRuntimes = ['1.0.0', '1.0.1'];

          if (!mobileEnv.EXPO_PUBLIC_DOMAIN) {
            throw new Error('Production API domain is required for OTA publishing.');
          }
          if (!supportedRuntimes.includes(appConfig.expo.runtimeVersion)) {
            throw new Error(
              `Current runtime ${appConfig.expo.runtimeVersion} is not in the supported OTA set.`,
            );
          }

          try {
            for (const runtimeVersion of supportedRuntimes) {
              appConfig.expo.runtimeVersion = runtimeVersion;
              fs.writeFileSync(appConfigPath, `${JSON.stringify(appConfig, null, 2)}\n`);

              const result = spawnSync(
                'pnpm',
                [
                  '--dir',
                  'artifacts/mobile',
                  'exec',
                  'eas',
                  'update',
                  '--channel',
                  'production',
                  '--platform',
                  'ios',
                  '--message',
                  `Publish production iOS update for runtime ${runtimeVersion}`,
                  '--non-interactive',
                ],
                { env: { ...process.env, ...mobileEnv }, stdio: 'inherit' },
              );

              if (result.error || result.status !== 0) {
                throw result.error ?? new Error(`OTA publish failed for runtime ${runtimeVersion}.`);
              }
            }
          } finally {
            fs.writeFileSync(appConfigPath, originalAppConfig);
          }
          NODE