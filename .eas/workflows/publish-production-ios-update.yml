name: Publish production iOS update

defaults:
  tools:
    node: "20"
    pnpm: "10.26.1"

jobs:
  publish_ios_update:
    name: Publish iOS OTA update
    environment: production
    steps:
      - uses: eas/checkout
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Publish iOS update
        run: pnpm --dir artifacts/mobile exec eas update --branch production --platform ios --non-interactive